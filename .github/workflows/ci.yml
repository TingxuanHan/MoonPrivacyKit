name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check MoonBit and run cross-target tests
        run: |
          moon version --all
          moon check --deny-warn --target wasm
          moon check --deny-warn --target js
          moon test --target wasm
          moon test --target js
          moon fmt
          git diff --exit-code
      - name: Build application and test file workflows
        run: |
          npm run build
          npm test
      - name: Browser workflows and screenshots
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Reproduce synthetic evaluation
        run: |
          mkdir -p reports
          node scripts/evaluate.mjs reports/evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-reports
          path: reports/
          retention-days: 14
